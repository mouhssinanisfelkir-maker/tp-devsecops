name: Trivy - scan de l'image Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    name: Build + Trivy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t tp-devsecops:${{ github.sha }} .

      - name: Trivy - rapport SARIF
         uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tp-devsecops:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'

      - name: Envoi du rapport vers l'onglet Securite
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Trivy - echec si CRITICAL
         uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: tp-devsecops:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'
